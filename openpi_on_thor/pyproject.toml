[project]
name = "openpi-on-thor"
version = "1.1.0"
description = "OpenPI deployment tooling for JetsonThor (ONNX export, TensorRT, quantization)"
readme = "README.md"
requires-python = ">=3.12"
license = { file = "../LICENSE" }
authors = [
    {name = "GEAR@NVIDIA-RESEARCH", email = "*@nvidia.com"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    # Root workspace package — brings torch, transformers, numpy, jax, etc.
    "openpi",
    # ONNX toolchain
    "onnx>=1.18.0",
    "onnxscript>=0.5.3",
    "onnx-ir>=0.1.10",
    "onnxruntime>=1.23.1",
    "onnx-graphsurgeon>=0.5.8",
    "onnxslim",
    # Thor-specific extras not in root
    "nvtx",
    "h5py>=3.12.1",
    "hydra-core>=1.3.2",
    "omegaconf>=2.3.0",
    "kornia>=0.7.4",
    "timm>=1.0.14",
    "accelerate>=1.2.1",
    "peft>=0.17.0",
    "av>=14.2.0",
    "torchcodec>=0.7.0",
    "diffusers>=0.36.0",
    "ml-dtypes>=0.5.3",
    "decord2",
    "pyzmq",
]

[project.optional-dependencies]
deploy = [
    "tensorrt-cu12>=10.15.1.29; platform_machine == 'x86_64' or platform_machine == 'AMD64'",
    "tensorrt-cu13>=10.15.1.29; platform_machine == 'aarch64'",
    "nvidia-modelopt>=0.42.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["openpi_on_thor"]

[tool.ruff]
line-length = 115
target-version = "py312"

[tool.ruff.lint.per-file-ignores]
"__init__.py" = ["F401"]
